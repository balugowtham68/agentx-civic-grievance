[pytest]
testpaths = tests
addopts = -q
pythonpath = .
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # starlette 1.x suggests httpx2 for TestClient; httpx 0.28 is still supported and also used by the Gemini/Whisper clients.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
